services:
  db:
    image: postgres:15-alpine
    container_name: pet_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pet_network
    restart: unless-stopped

  srs:
    image: ossrs/srs:5
    container_name: pet_srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf
    command: ./objs/srs -c conf/srs.conf
    networks:
      - pet_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pet_api
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - pet_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: pet_pwa
    ports:
      - "5173:5173"
    networks:
      - pet_network
    restart: unless-stopped

  ffmpeg:
    image: linuxserver/ffmpeg:latest
    container_name: pet_ffmpeg
    depends_on:
      - srs
    networks:
      - pet_network
    restart: unless-stopped

networks:
  pet_network:
    driver: bridge

volumes:
  pgdata:
