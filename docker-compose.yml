services:
  db:
    image: postgres:15-alpine
    container_name: pet_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pet_network
    restart: unless-stopped

  srs:
    image: ossrs/srs:5
    container_name: pet_srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf
    command: ./objs/srs -c conf/srs.conf
    networks:
      - pet_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pet-api
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - pet_network
    restart: unless-stopped

  # Serviço Opcional: Ingestão via RTSP (Mais estável que RTMP Push para muitos DVRs)
  # ffmpeg_ingest:
  #   image: jrottenberg/ffmpeg:6.1-alpine
  #   container_name: pet_ffmpeg_ingest
  #   command: >
  #     -re -i rtsp://${DVR_USER}:${DVR_PASS}@${DVR_IP}:554/cam/realmonitor?channel=${DVR_CHANNEL}&subtype=0
  #     -c:v libx264 -preset ultrafast -tune zerolatency -b:v 1500k
  #     -c:a aac -ar 44100 -b:a 64k
  #     -f flv rtmp://srs:1935/live/camera1?key=${STREAM_KEY}
  #   depends_on:
  #     - srs
  #   networks:
  #     - pet_network
  #   restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: pet_pwa
    ports:
      - "5173:5173"
    networks:
      - pet_network
    restart: unless-stopped

# Fim dos serviços
networks:
  pet_network:
    driver: bridge

volumes:
  pgdata:
