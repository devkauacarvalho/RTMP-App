services:
  db:
    image: postgres:15-alpine
    container_name: pet_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pet_network
    restart: unless-stopped

  srs:
    image: ossrs/srs:5
    container_name: pet_srs
    ports:
      # RTMP: porta pública para receber push do DVR (não vai pelo Nginx)
      - "1935:1935"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf
    command: ./objs/srs -c conf/srs.conf
    networks:
      - pet_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pet-api
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    # Porta 3000 acessível apenas internamente via Nginx
    # Não exposta publicamente
    networks:
      - pet_network
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: pet_pwa
    # Porta 5173 acessível apenas internamente via Nginx
    # Não exposta publicamente
    networks:
      - pet_network
    restart: unless-stopped

  # ============================================================
  # TAREFA 3.2: Proxy Reverso Nginx com suporte a HTTPS/SSL
  # ============================================================
  nginx:
    image: nginx:stable-alpine
    container_name: pet_nginx
    ports:
      - "80:80"    # HTTP (redireciona para HTTPS)
      - "443:443"  # HTTPS (tráfego principal do PWA e API)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - srs
    networks:
      - pet_network
    restart: unless-stopped

  # ============================================================
  # Certbot removido pois não há domínio configurado.
  # Utilizando certificados auto-assinados locais.
  # ============================================================

  # Serviço Opcional: Ingestão via RTSP (Mais estável que RTMP Push para muitos DVRs)
  # ffmpeg_ingest:
  #   image: jrottenberg/ffmpeg:6.1-alpine
  #   container_name: pet_ffmpeg_ingest
  #   command: >
  #     -re -i rtsp://${DVR_USER}:${DVR_PASS}@${DVR_IP}:554/cam/realmonitor?channel=${DVR_CHANNEL}&subtype=0
  #     -c:v libx264 -preset ultrafast -tune zerolatency -b:v 1500k
  #     -c:a aac -ar 44100 -b:a 64k
  #     -f flv rtmp://srs:1935/live/camera1?key=${STREAM_KEY}
  #   depends_on:
  #     - srs
  #   networks:
  #     - pet_network
  #   restart: unless-stopped

# Fim dos serviços
networks:
  pet_network:
    driver: bridge

volumes:
  pgdata:
