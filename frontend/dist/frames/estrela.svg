<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
  </defs>
  
  <!-- Borda Principal Dupla -->
  <rect x="30" y="30" width="1220" height="660" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  <rect x="45" y="45" width="1190" height="630" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  
  <!-- Coroa e Estrelas (Canto Superior) -->
  <g fill="url(#gold)" transform="translate(640, 60) scale(1.5)" filter="url(#glow)">
    <!-- Coroa (Centro Superior) -->
    <path d="M-15 0 L-25 -20 L-5 -10 L0 -30 L5 -10 L25 -20 L15 0 Z" />
    <circle cx="-25" cy="-20" r="3" />
    <circle cx="0" cy="-30" r="3" />
    <circle cx="25" cy="-20" r="3" />
  </g>
  
  <g fill="url(#gold)" transform="translate(40, 40) scale(1.5)">
      <polygon points="10,0 13,7 20,7 15,12 17,20 10,15 3,20 5,12 0,7 7,7" />
  </g>
  <g fill="url(#gold)" transform="translate(1200, 40) scale(1.5)">
      <polygon points="10,0 13,7 20,7 15,12 17,20 10,15 3,20 5,12 0,7 7,7" />
  </g>

  <!-- Texto -->
  <rect x="440" y="620" width="400" height="70" fill="black" opacity="0.6" rx="10" ry="10"/>
  <text x="640" y="668" font-family="serif" font-weight="bold" font-size="38" fill="url(#gold)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">ESTRELA PET</text>
</svg>
