# ============================================================
# Configuração para Certificado Auto-assinado (Sem Domínio)
# ============================================================

# --- Bloco 1: Redirecionar HTTP (80) para HTTPS (443) ---
server {
    listen 80;
    server_name 18.229.158.162 _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Bloco 2: Servidor HTTPS principal (443) ---
server {
    listen 443 ssl;
    server_name 18.229.158.162 _;

    # Caminhos dos certificados auto-assinados
    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Configurações SSL modernas e seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de segurança recomendados para PWA
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # --- Proxy para o Frontend (PWA React/Vite) ---
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Proxy para o Backend (API Node.js/Express) ---
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Proxy para o SRS (LL-HLS Streams) ---
    # Permite acesso seguro aos arquivos .m3u8 e .ts via HTTPS,
    # evitando erros de Mixed Content no hls.js.
    location /live/ {
        proxy_pass         http://srs:8080/live/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Headers necessários para streaming HLS
        add_header         Cache-Control "no-cache";
        add_header         Access-Control-Allow-Origin "*";
    }
}
