listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Vhost principal
vhost __defaultVhost__ {
    play {
        mix_correct     on;
    }

    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      300;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1024;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            # Força o áudio para 44100Hz para estabilizar o buffer do Chrome
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       1;
            # O pulo do gato: sincroniza timestamps na saída
            output          rtmp://127.0.0.1:1935/clean/[stream]?vhost=internal;
        }
    }
}

# Vhost interno para gerar HLS sem erros de tempo
vhost internal {
    play {
        mix_correct     on;
    }
    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      300;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
