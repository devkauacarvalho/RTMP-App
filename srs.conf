listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # Corrige timestamps para DVRs
    play {
        mix_correct     on;
    }

    # Transcodificação apenas para a aplicação "live"
    # O resultado vai para a aplicação "clean", evitando o loop
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            # Apenas transcodifica se vier da app 'live'
            if_format       flv; 
            vcodec          libx264;
            vbitrate        1024;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac; # Usando codec universal
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:1935/clean/[stream];
        }
    }

    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      300;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
