listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# VHOST 1: Público (Ingestão e Transcodificação)
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # Transcodificador: Envia para o vhost interno
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }

    # FIX 404 DEFINITIVO: Mapeia o mount '/live/' diretamente para a pasta onde os arquivos são gerados
    # No SRS 5, o vhost 127.0.0.1 gera em html/127.0.0.1/live/
    http_static {
        enabled     on;
        mount       /live;
        dir         ./objs/nginx/html/127.0.0.1/live;
    }
}

# VHOST 2: Interno (Geração do HLS)
vhost 127.0.0.1 {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html; # Raiz base
        hls_fragment    2;
        hls_window      10;
        hls_m3u8_file   [app]/[stream].m3u8; # Fica em html/127.0.0.1/live/cam522.m3u8
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
