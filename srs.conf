listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Vhost principal
vhost __defaultVhost__ {
    play {
        mix_correct     on;
    }

    # HLS Original (apenas para debug se necessário)
    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      60;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1024;
            vfps            20; # Reduzi um pouco o FPS para estabilizar
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           40;
                # Força a geração de novos tempos para o Chrome não engasgar
                fflags      +genpts;
            }
            # DESATIVA O ÁUDIO TOTALMENTE PARA ELIMINAR bufferAppendError
            acodec          vn; 
            output          rtmp://127.0.0.1:1935/clean/[stream]?vhost=internal;
        }
    }
}

# Vhost interno para gerar o HLS final "mudo" e estável
vhost internal {
    play {
        mix_correct     on;
    }
    hls {
        enabled         on;
        hls_fragment    4; # Fragmentos menores para latência menor
        hls_window      40;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
