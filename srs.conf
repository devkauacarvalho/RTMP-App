listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# VHOST 1: Público (Ingestão e Transcodificação APENAS)
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # DESATIVADO HLS aqui para não conflitar com o vhost interno
    hls {
        enabled         off;
    }

    # Transcodificador: Converte e envia para o VHost 'hls-internal'
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1000;
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
            }
            acodec          none; 
            # PUBLICA PARA O VHOST INTERNO USANDO NOME ÚNICO
            output          rtmp://127.0.0.1:1935/live/[stream]?vhost=hls-internal;
        }
    }

    # FIX 404 DEFINITIVO: Mapeia o mount '/live/' para a pasta do vhost 'hls-internal'
    http_static {
        enabled     on;
        mount       /live;
        dir         ./objs/nginx/html/hls-internal/live;
    }
}

# VHOST 2: Entrega HLS (Interno/Final)
vhost hls-internal {
    # Sem hooks e sem transcode aqui para quebrar o loop
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    5;
        hls_window      30;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
