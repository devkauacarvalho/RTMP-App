listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# VHOST Padrão: Recebe o sinal Ingest e Transcodifica
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet_api:3000/api/video/auth-publish;
        on_unpublish    http://pet_api:3000/api/video/on-unpublish;
    }

    # Transcodificador: Puxa o sinal e joga para o vhost interno
    transcode {
        enabled     on;
        ffmpeg      ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # PUBLICAÇÃO: Envia para o vhost 127.0.0.1 para gerar o HLS
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }
}

# VHOST Interno: Responsável apenas por gerar o HLS
vhost 127.0.0.1 {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
        hls_m3u8_file   live/[stream].m3u8;
        hls_ts_file     live/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
