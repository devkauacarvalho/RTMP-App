listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# Habilita a API para o Console e monitoramento funcionar
http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             /usr/local/srs/objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # Webhooks apontando para o nome do container no Docker
    http_hooks {
        enabled         on;
        on_publish      http://pet_api:3000/api/video/auth-publish;
        on_unpublish    http://pet_api:3000/api/video/on-unpublish;
    }

    # Aplicativo de Entrada (Onde o DVR/OBS envia o sinal)
    app ingest {
        transcode {
            enabled     on;
            ffmpeg      ffmpeg;
            engine clean {
                enabled         on;
                vcodec          libx264;
                vbitrate        1500;
                vfps            25;
                vwidth          1280;
                vheight         720;
                vthreads        2;
                vprofile        main;
                vpreset         veryfast;
                vparams {
                    tune        zerolatency;
                    g           50;
                }
                acodec          aac;
                abitrate        64;
                asample_rate    44100;
                achannels       2;
                # Republica internamente para o app 'live' para gerar HLS
                output          rtmp://127.0.0.1:1935/live/[stream];
            }
        }
    }

    # Aplicativo de Saída (Onde o sinal limpo é servido via HLS)
    app live {
        hls {
            enabled         on;
            hls_path        /usr/local/srs/objs/nginx/html;
            hls_fragment    2;
            hls_window      10;
            hls_m3u8_file   [app]/[stream].m3u8;
            hls_ts_file     [app]/[stream]-[seq].ts;
            hls_cleanup     on;
        }
    }
}
