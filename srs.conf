listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# VHOST 1: Ingestão e Transcodificação (Público)
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # Transcodificador: Puxa o sinal ingest e envia para o vhost interno
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # PUBLICA PARA O VHOST INTERNO (127.0.0.1)
            # Isso separa o sinal processado do sinal bruto
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }

    # FIX 404: Mapeia os arquivos gerados pelo vhost interno para serem acessíveis publicamente
    # O vhost 127.0.0.1 gera arquivos em ./objs/nginx/html/127.0.0.1/live/
    http_static {
        enabled     on;
        mount       /live;
        dir         ./objs/nginx/html/127.0.0.1/live;
    }
}

# VHOST 2: Entrega HLS (Interno/Loopback)
# IMPORTANTE: Este vhost NÃO tem transcode, o que quebra o loop infinito
vhost 127.0.0.1 {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
