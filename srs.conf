listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# VHOST 1: Ingestão Primária (DVR / OBS)
vhost __defaultVhost__ {
    # Webhooks para Autenticação e Status
    http_hooks {
        enabled         on;
        on_publish      http://backend:3000/api/video/auth-publish;
        on_unpublish    http://backend:3000/api/video/on-unpublish;
    }

    # Desativa HLS na entrada "suja"
    hls {
        enabled         off;
    }

    # Transcodificação: Resolve H.265 e áudio incompatível (G.711)
    transcode {
        enabled     on;
        ffmpeg      ffmpeg; # Binário global do container
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac; # Converte áudio para formato web
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # Envia para o vhost interno (127.0.0.1) que não requer autenticação
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }
}

# VHOST 2: Distribuição HLS (Sinal Limpo)
vhost 127.0.0.1 {
    # Sem http_hooks aqui para evitar loop de autenticação
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
