listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # Webhooks para controle de acesso
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # Transcodificador: Aplica-se apenas ao que chega no app 'ingest'
    # Converte DVR (H.265/G.711) -> Web (H.264/AAC)
    transcode ingest {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        800;    # Prioridade para fluidez
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        1;
            vprofile        main;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
            }
            acodec          aac;    # Reativando áudio AAC (mais compatível)
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # Publica o sinal convertido no app 'live' do mesmo vhost
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }

    # HLS: Gera os arquivos para os streams no app 'live'
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    5;
        hls_window      30;
        # Os arquivos ficarão em ./objs/nginx/html/live/cam522.m3u8
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
