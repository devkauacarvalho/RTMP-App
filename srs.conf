listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# VHOST 1: Recebe o sinal "sujo" do DVR
vhost __defaultVhost__ {
    # DESATIVAMOS o HLS aqui para não gerar arquivos corruptos
    hls {
        enabled         off;
    }

    # Transcodificador: Puxa o sinal do DVR, remove o áudio e envia para o VHOST 2
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1000;
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           40;
            }
            acodec          none; # Remove o áudio problemático
            # Envia para o IP local, o que forçará o SRS a usar o VHOST 2 (sem loop)
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }
}

# VHOST 2: Recebe o sinal "limpo" e gera o HLS para o site
vhost 127.0.0.1 {
    hls {
        enabled         on;
        hls_fragment    4;
        hls_window      40;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
