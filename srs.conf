listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# VHOST 1: Público (Ingestão e Transcodificação)
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # Transcodificador ULTRA LEVE para não derrubar a conexão do DVR
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        500;    # Baixo consumo de CPU/Banda
            vfps            15;
            vwidth          854;    # 480p - Estabilidade acima de tudo
            vheight         480;
            vthreads        1;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
            }
            acodec          none; 
            # Publica para o vhost interno 127.0.0.1
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }

    # FIX 404: Mapeia o IP público para ler a pasta do vhost 127.0.0.1
    http_static {
        enabled     on;
        mount       /live;
        dir         ./objs/nginx/html/127.0.0.1/live;
    }
}

# VHOST 2: Interno (Geração HLS)
vhost 127.0.0.1 {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    5;
        hls_window      30;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
