listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Vhost principal (Recebe o sinal do DVR e atende o navegador)
vhost __defaultVhost__ {
    play {
        mix_correct     on;
    }

    # Gera HLS para tudo o que passar por aqui
    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      300;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    # Transcodifica apenas o sinal que entra como "live"
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1024;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          copy; # Copia o áudio original para evitar erro de Hz
            # Envia para um vhost interno para evitar loop infinito
            output          rtmp://127.0.0.1:1935/clean/[stream]?vhost=internal;
        }
    }
}

# Vhost interno apenas para processar o sinal limpo sem re-transcodificar
vhost internal {
    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      300;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
