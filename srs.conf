listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             /usr/local/srs/objs/nginx/html;
    crossdomain     on;
}

# VHOST DE INGESTÃO (Público)
# Responsável por receber o sinal do DVR/OBS e transcodificar
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://backend:3000/api/video/auth-publish;
        on_unpublish    http://backend:3000/api/video/on-unpublish;
    }

    # Transcodificação: Converte para H.264/AAC e envia para o vhost local
    transcode {
        enabled     on;
        ffmpeg      ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # Envia para o vhost 127.0.0.1 (app 'live') para gerar o HLS
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }
}

# VHOST DE ENTREGA (Interno/HLS)
# Recebe o sinal limpo e gera os arquivos para o site
vhost 127.0.0.1 {
    # Sem hooks aqui para evitar loops de autenticação
    hls {
        enabled         on;
        hls_path        /usr/local/srs/objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
        hls_m3u8_file   live/[stream].m3u8;
        hls_ts_file     live/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
