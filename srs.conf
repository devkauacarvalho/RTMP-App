listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on; # Essencial para o PWA não tomar erro de CORS no navegador
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    2; # Fragmentos de 2 segundos para baixar a latência
        hls_window      10; # Mantém 10 segundos de vídeo na janela do player
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    http_hooks {
        enabled         on;
        on_publish      http://backend:3000/api/video/auth-publish;
        on_unpublish    http://backend:3000/api/video/on-unpublish;
    }
}