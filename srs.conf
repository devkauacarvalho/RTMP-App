listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    play {
        mix_correct     on;
    }

    # HLS para gerar o vídeo final
    hls {
        enabled         on;
        hls_fragment    4;
        hls_window      40;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            
            # Aqui está o segredo:
            # -map 0:v diz "Pegue apenas a trilha de vídeo do input 0"
            # Ignorando a trilha de áudio completamente.
            vfilter {
                v       -map 0:v;
            }

            vcodec          libx264;
            vbitrate        1000;
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           40;
            }
            # Nenhum codec de áudio será gerado
            acodec          none; 
            
            # Envia para a pasta 'clean'
            output          rtmp://127.0.0.1:1935/clean/[stream];
        }
    }
}
