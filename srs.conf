listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # Transcodificador: Publica localmente
    transcode ingest {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        800;
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        1;
            vprofile        main;
            vpreset         ultrafast;
            vparams { tune zerolatency; }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }

    # HLS: Configuração de caminho absoluto para evitar pastas de vhost (127.0.0.1)
    hls {
        enabled         on;
        hls_path        /usr/local/srs/objs/nginx/html;
        hls_fragment    5;
        hls_window      30;
        hls_m3u8_file   live/[stream].m3u8;
        hls_ts_file     live/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
