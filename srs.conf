listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # Habilitar HLS para as duas pastas virtuais
    hls {
        enabled         on;
        hls_fragment    5;
        hls_window      60;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    # Transcodificador interno (estável e rápido)
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1000;
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams {
                tune        zerolatency;
                g           40;
            }
            # DESATIVA O ÁUDIO (acodec none é o comando correto no SRS)
            acodec          none; 
            # Envia para a pasta "clean" dentro do próprio servidor
            output          rtmp://127.0.0.1:1935/clean/[stream];
        }
    }
}
