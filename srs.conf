listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    # Usando estritamente o padrão do SRS, sem forçar caminhos absolutos
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # HLS ativado diretamente no VHost padrão
    hls {
        enabled         on;
        hls_fragment    4;
        hls_window      20;
        # Caminhos relativos padrão. Os arquivos ficarão em ./objs/nginx/html/live/cam522.m3u8
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }

    # Transcodificador para o sinal do DVR (Ativado apenas para o app 'ingest')
    transcode ingest {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        800;
            vfps            20;
            vwidth          1280;
            vheight         720;
            vthreads        1;
            vprofile        main;
            vpreset         ultrafast;
            vparams { tune zerolatency; }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # Publica o sinal limpo de volta no mesmo vhost, mas no app 'live'
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }
}
