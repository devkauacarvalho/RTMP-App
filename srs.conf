listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             /usr/local/srs/objs/nginx/html;
    crossdomain     on;
}

# VHOST PLAYBACK & INGEST (Público)
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://backend:3000/api/video/auth-publish;
        on_unpublish    http://backend:3000/api/video/on-unpublish;
    }

    transcode {
        enabled     on;
        ffmpeg      ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:1935/live/[stream];
        }
    }

    # FIX 404: Mapeia o diretório HLS do vhost 127.0.0.1 para o VHost padrão
    http_static {
        enabled     on;
        mount       /live;
        dir         /usr/local/srs/objs/nginx/html/live;
    }
}

# VHOST INTERNO (Apenas para geração do HLS)
vhost 127.0.0.1 {
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        /usr/local/srs/objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
