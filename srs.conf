listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# VHOST 1: Público (Ingestão e Transcodificação)
vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://pet-api:3000/api/video/auth-publish;
        on_unpublish    http://pet-api:3000/api/video/on-unpublish;
    }

    # Transcodificador: Envia para o VHost 'hls.internal'
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg; 
        engine clean {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                tune        zerolatency;
                g           50;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            # PUBLICA PARA UM VHOST COM NOME EXPLÍCITO
            # O parâmetro ?vhost=hls.internal garante que o SRS use o vhost correto abaixo
            output          rtmp://127.0.0.1:1935/live/[stream]?vhost=hls.internal;
        }
    }

    # Mapeia a pasta física do vhost 'hls.internal' para o acesso via IP público
    http_static {
        enabled     on;
        mount       /live;
        dir         ./objs/nginx/html/hls.internal/live;
    }
}

# VHOST 2: Interno (Entrega HLS Estável)
vhost hls.internal {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    4;
        hls_window      20;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
